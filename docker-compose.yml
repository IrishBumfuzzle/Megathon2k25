version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # image: megathon2k25:latest
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    # restart: unless-stopped
    command: ["python", "main.py"]

